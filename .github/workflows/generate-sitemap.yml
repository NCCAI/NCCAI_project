name: Generate Repository Sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - "SITEMAP.md"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          ROOT = Path(".")

          # Folders/files we do not want in the sitemap
          IGNORE = {
              ".git",
              ".github",
              "__pycache__",
              ".ipynb_checkpoints",
              "node_modules",
              ".venv",
              "venv"
          }

          lines = []

          lines.append("# NCCAI Repository Sitemap")
          lines.append("")
          lines.append(
              "This sitemap is generated automatically from the "
              "current GitHub repository structure."
          )
          lines.append("")
          lines.append("```mermaid")
          lines.append("flowchart TD")

          counter = 0

          def clean_name(name):
              return (
                  name.replace('"', "'")
                      .replace("[", "(")
                      .replace("]", ")")
              )

          def node_id():
              global counter
              counter += 1
              return f"N{counter}"

          root_id = node_id()

          lines.append(
              f'    {root_id}["NCCAI Project"]'
          )

          def walk(directory, parent_id, depth=0):

              entries = sorted(
                  [
                      p for p in directory.iterdir()
                      if p.name not in IGNORE
                      and not p.name.startswith(".")
                  ],
                  key=lambda p: (
                      not p.is_dir(),
                      p.name.lower()
                  )
              )

              for entry in entries:

                  current_id = node_id()

                  name = clean_name(entry.name)

                  if entry.is_dir():

                      lines.append(
                          f'    {current_id}["📁 {name}"]'
                      )

                      lines.append(
                          f"    {parent_id} --> {current_id}"
                      )

                      walk(
                          entry,
                          current_id,
                          depth + 1
                      )

                  else:

                      lines.append(
                          f'    {current_id}["📄 {name}"]'
                      )

                      lines.append(
                          f"    {parent_id} --> {current_id}"
                      )

          walk(ROOT, root_id)

          lines.append("```")
          lines.append("")
          lines.append(
              "> This file is automatically generated by GitHub Actions."
          )

          Path("SITEMAP.md").write_text(
              "\n".join(lines),
              encoding="utf-8"
          )
          PY

      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SITEMAP.md

          if git diff --cached --quiet; then
            echo "No sitemap changes."
          else
            git commit -m "Auto-update repository sitemap [skip ci]"
            git push
          fi
